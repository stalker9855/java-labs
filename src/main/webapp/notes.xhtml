<ui:composition template="templates/layout.xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui">
    <ui:define name="title">Manage Notes</ui:define>
    <ui:define name="content">
        <p:menubar>
            <p:menuitem value="Home" url="#"/>
            <p:menuitem value="Notes" url="#"/>
            <p:menuitem value="About" url="#"/>
        </p:menubar>

<h:form>
    <div class="card">
        <h2>Add a Note</h2>

        <!-- Поля вводу -->
        <div class="form-fields">
            <h:outputLabel value="Title:" for="title"/>
            <p:inputText id="title" value="#{noteBean.note.title}" required="true"/>

            <h:outputLabel value="Content:" for="content"/>
            <p:inputTextarea id="content" value="#{noteBean.note.content}"/>
        </div>

        <!-- Кнопки -->
        <div class="form-buttons">
            <p:commandButton value="Save" action="#{noteBean.addNote}" update="notes growl" icon="pi pi-check"/>
            <p:commandButton value="Reset" type="reset" icon="pi pi-refresh"/>
        </div>

        <p:growl id="growl" showDetail="true"/>
    </div>
</h:form>

        <h2>Notes</h2>
        <h:form id="notes">
            <p:dataTable value="#{noteBean.notes}" var="note" styleClass="notes-table" emptyMessage="No notes available.">
                <p:column headerText="Title">
                    <h:outputText value="#{note.title}" />
                </p:column>
                <p:column headerText="Content">
                    <h:outputText value="#{note.content}" />
                </p:column>
                <p:column headerText="Actions">
                    <p:commandButton value="Delete" icon="pi pi-trash" onclick="PF('confirmDialog').show()" process="@this">
                        <f:setPropertyActionListener target="#{noteBean.selectedNote}" value="#{note}" />
                    </p:commandButton>
                </p:column>
            </p:dataTable>
        </h:form>

        <p:confirmDialog widgetVar="confirmDialog" header="Confirm Deletion" message="Are you sure you want to delete this note?"
                         icon="pi pi-exclamation-triangle">
            <p:commandButton value="Yes" action="#{noteBean.deleteSelectedNote}" 
                             update="notes growl" icon="pi pi-check"
                             oncomplete="PF('confirmDialog').hide()" />
            <p:commandButton value="No" onclick="PF('confirmDialog').hide()" 
                             type="button" icon="pi pi-times" />
        </p:confirmDialog>
    </ui:define>
</ui:composition>
