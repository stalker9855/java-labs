<!DOCTYPE html>
<ui:composition template="/WEB-INF/views/layout.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">Books</ui:define>

    <ui:define name="content">
        <h1>Books List</h1>
        <h:form>
            <h:dataTable value="#{books}" var="book" border="1" class="table table-striped table-bordered">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{book.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Title</f:facet>
                    #{book.title}
                </h:column>
                <h:column>
                    <f:facet name="header">Description</f:facet>
                    #{book.description}
                </h:column>
                <h:column>
                    <f:facet name="header">Author</f:facet>
                    #{book.author.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Rating</f:facet>
                    #{avgRatings[book.id]}
                </h:column>
                <h:column>
                    <f:facet name="header">Actions</f:facet>
                    <a href="#{mvc.basePath}/books/#{book.id}/bookEdit">Edit</a>
                    <form action="#{mvc.basePath}/books/#{book.id}" method="post">
                      <input type="hidden" name="_method" value="DELETE" ></input>
                      <button type="submit">Delete</button>
                    </form>
                </h:column>
            </h:dataTable>
        </h:form>

        <h1>Authors List</h1>
        <h:form>
            <h:dataTable value="#{authors}" var="author" border="1" class="table table-striped table-bordered">
                <h:column>
                    <f:facet name="header">Id</f:facet>
                    #{author.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{author.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Book Count</f:facet>
                    #{booksCountByAuthor[author.id]}
                </h:column>
            </h:dataTable>
        </h:form>

        <h1>Add New Book</h1>
        <form id="form" action="#{bookController.createBook}" method="post">
            <h:panelGrid columns="2">
                <p>Title:</p>
                <label for="title" value="Title:" />
                <input id="title" name="title" required="true" />

                <p>Description:</p>
                <label for="description" value="Description:" />
                <input id="description" name="description" required="true" />

                <p>Author ID:</p>
                <label for="author" value="Author ID:" />
                <input id="author" name="author" required="true" />
            </h:panelGrid>
            <button value="Create book" type="submit" action="#{bookController.createBook}">Create</button>
        </form>
    </ui:define>
</ui:composition>
