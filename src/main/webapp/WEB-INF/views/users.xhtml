<!DOCTYPE html>
<ui:composition template="/WEB-INF/views/layout.xhtml"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <ui:define name="title">List of Users</ui:define>

    <ui:define name="content">
        <h1 class="my-4">List of Users</h1>
        <h2>Active users: #{activeUsers}</h2>
        <div class="table-responsive">
            <h:dataTable value="#{users}" var="user" class="table table-striped table-bordered">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    #{user.id}
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{user.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{user.email}
                </h:column>
            </h:dataTable>
        </div>
    </ui:define>
</ui:composition>
