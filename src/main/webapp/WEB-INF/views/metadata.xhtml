<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">
<head>
    <title>Metadata Beans</title>
</head>
<body>
    <h1>Metadata Beans</h1>
    <h1>#{beanName}</h1>
    <c:forEach items="#{metadata.keySet()}" var="beanName">
      <td>#{metadata[beanName]}</td>
    </c:forEach>
</body>
</html>
